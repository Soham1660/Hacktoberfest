[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "PRChecker"
version = "0.1.0"
requires-python = "~=3.11.0"

dependencies = [
    "torch == 2.12.1",
    "pandas == 2.3.3",
    "numpy == 2.4.6",
    "requests == 2.34.2",
    "scikit-learn == 1.9.0",
    "matplotlib == 3.10.9",
    "jupyterlab == 4.6.0",
    "joblib == 1.5.3"
]
readme = "README.md"
license = "MIT"

authors = [
    { name = "Sidharth Nambiar", email = "sidnambiar2008@gmail.com" }
]
maintainers = [
    { name = "Sidharth Nambiar", email = "sidnambiar2008@gmail.com" }
]
description = "Validate the PR Requests pushed by other to the code provided in the request."
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = [
    "Pull Requests", "Github Search"
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]


